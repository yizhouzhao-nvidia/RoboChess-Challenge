# The robot description defines the generalized coordinates and how to map those
# to the underlying URDF dofs.

api_version: 1.0

# Defines the generalized coordinates. Each generalized coordinate is assumed
# to have an entry in the URDF.
# Lula will only use these joints to control the robot position.
cspace:
    - shoulder_pan
    - shoulder_lift
    - elbow_flex
    - wrist_flex
    - wrist_roll
    - gripper
default_q: [
    -0.0,0.0075,0.0005,0.0001,0.0,0.0012
]

acceleration_limits: [
   10.0,10.0,10.0,10.0,10.0,10.0
]

jerk_limits: [
   10000.0,10000.0,10000.0,10000.0,10000.0,10000.0
]

# Most dimensions of the cspace have a direct corresponding element
# in the URDF. This list of rules defines how unspecified coordinates
# should be extracted or how values in the URDF should be overwritten.

cspace_to_urdf_rules:

# Lula uses collision spheres to define the robot geometry in order to avoid
# collisions with external obstacles.  If no spheres are specified, Lula will
# not be able to avoid obstacles.

collision_spheres:
  - base_link:
    - "center": [0.01637, 0.0, 0.04907]
      "radius": 0.04326
  - wrist_link:
    - "center": [0.00045, -0.04487, 0.02655]
      "radius": 0.02585
  - shoulder_link:
    - "center": [-0.03802, -0.0, 0.02557]
      "radius": 0.02
    - "center": [-0.04229, -0.0, -0.0155]
      "radius": 0.02
  - upper_arm_link:
    - "center": [-0.00983, 0.00014, 0.01745]
      "radius": 0.03
    - "center": [-0.06563, -0.00281, 0.01765]
      "radius": 0.03
    - "center": [-0.11065, 0.00202, 0.01878]
      "radius": 0.02
  - lower_arm_link:
    - "center": [-0.01224, 0.00024, 0.01908]
      "radius": 0.025
    - "center": [-0.05956, 0.00118, 0.02014]
      "radius": 0.025
    - "center": [-0.10744, 0.00214, 0.01766]
      "radius": 0.025
  - gripper_link:
    - "center": [0.01711, 0.00083, -0.02266]
      "radius": 0.02
    - "center": [-0.02084, -0.00102, -0.02371]
      "radius": 0.02
    - "center": [-0.0213, -0.00104, -0.06096]
      "radius": 0.012
    - "center": [-0.01524, -0.00074, -0.09063]
      "radius": 0.008
  - moving_jaw_so101_v1_link:
    - "center": [-0.00076, -0.02958, 0.01849]
      "radius": 0.01
    - "center": [-0.00162, -0.05006, 0.01803]
      "radius": 0.008
    - "center": [-0.00699, -0.07173, 0.01937]
      "radius": 0.006
